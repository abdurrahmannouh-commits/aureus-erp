services:
  aureus-erp:
    image: webkul/aureuserp:latest
    container_name: aureus-erp
    restart: unless-stopped
    ports:
      - "8085:80"
      - "3307:3306"
    volumes:
      - aureus_storage:/var/www/html/storage
      - aureus_db_data:/var/lib/mysql
    environment:
      - APP_URL=http://localhost:8085

volumes:
  aureus_storage:
    name: aureus_storage
  aureus_db_data:
    name: aureus_db_data
