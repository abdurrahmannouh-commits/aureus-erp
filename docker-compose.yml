services:
  aureus-erp:
    image: webkul/aureuserp:latest
    container_name: aureus-erp
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - aureus-storage:/var/www/aureuserp/storage
      - aureus-mysql:/var/lib/mysql
    environment:
      - APP_URL=http://localhost:8085
      - APP_NAME=Aureus ERP

volumes:
  aureus-storage:
    name: aureus-storage
  aureus-mysql:
    name: aureus-mysql
